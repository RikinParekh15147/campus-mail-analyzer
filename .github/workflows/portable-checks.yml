name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Set up macOS
        if: runner.os == 'macOS'
        run: bash scripts/setup.sh --backend-only
      - name: Set up Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1 -Python python -BackendOnly
      - run: npm --prefix desktop ci
      - name: Verify portable workflow and record evidence
        shell: bash
        run: python scripts/verify_portable.py --desktop-workflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: artifacts/verification/
